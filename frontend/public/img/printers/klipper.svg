<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Printer">
  <!--
    Neutral printer for providers that are not Bambu Lab.

    The other images in this folder are product renders of specific Bambu
    machines, and the fallback among them is an X1 — so any printer whose model
    string matched nothing, which is every Klipper machine, was drawn as a Bambu.
    A Voron is not a Bambu, and a drawing of a Voron would be wrong too: they are
    all different. Hence the frame every CoreXY shares, asserting nothing about
    the machine beyond "printer".

    Two things this file learned the hard way:

    * The colour is literal, not `currentColor`. Both call sites render this
      through `<img src>`, which loads it as its own document with no styling
      context, so `currentColor` resolves to black and the whole drawing
      disappears into a dark card. This grey is legible on both themes.
    * The strokes are heavy for the viewBox. The card draws this at about 48px,
      where anything finer turns to mush.
  -->
  <g fill="none" stroke="#9ca3af" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame -->
    <rect x="12" y="16" width="76" height="66" rx="7" fill="#9ca3af" fill-opacity="0.08" />
    <!-- Gantry rail -->
    <path d="M12 41 H88" />
    <!-- Toolhead on the rail -->
    <rect x="41" y="34" width="18" height="14" rx="3" fill="#9ca3af" fill-opacity="0.45" stroke-width="3" />
    <!-- Nozzle -->
    <path d="M50 48 V54" stroke-width="4" />
    <!-- Bed -->
    <path d="M24 68 H76" stroke-width="6" />
    <!-- Feet -->
    <path d="M27 82 V90" />
    <path d="M73 82 V90" />
  </g>
</svg>
